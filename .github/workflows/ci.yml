name: Package checks
# Pre-PR checks moved to local /verify; manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm pack --dry-run
