name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已合并并验证的版本标签，例如 v0.2.1'
        required: true
        type: string
      publish:
        description: '确认真实发布到 npm；不勾选则仅验证'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'liush2yuxjtu/pi-design-mode' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 验证发布标签
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          git checkout --detach "refs/tags/$RELEASE_TAG"
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: 验证 npm OIDC 支持
        run: |
          node --version
          npm --version
          node -e 'const {execSync}=require("node:child_process");const [a,b,c]=execSync("npm --version",{encoding:"utf8"}).trim().split(".").map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))process.exit(1)'
      - run: npm ci --ignore-scripts
      - name: 校验与打包
        run: npm pack
      - name: 仅验证发布包
        if: ${{ !inputs.publish }}
        run: npm publish "pi-design-mode-$(node -p 'require("./package.json").version').tgz" --dry-run --access public
      - name: 使用 OIDC 发布，无长期 Token
        if: ${{ inputs.publish }}
        run: npm publish "pi-design-mode-$(node -p 'require("./package.json").version').tgz" --access public --provenance
      - name: 核验公开版本
        if: ${{ inputs.publish }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          npm view "pi-design-mode@$VERSION" version dist.integrity --json
