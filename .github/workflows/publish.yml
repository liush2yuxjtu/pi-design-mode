name: Publish to npm
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '已合并并验证的版本标签，例如 v0.2.1'
        required: true
        type: string
      publish:
        description: '确认真实发布到 npm；不勾选则仅验证'
        required: true
        default: false
        type: boolean
      verify_only:
        description: '仅核验已发布版本，不重复发布'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'liush2yuxjtu/pi-design-mode' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Resolve verified release
        id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="$(node -p 'require("./package.json").version')"
            test "$VERSION" = "0.3.4"
            RELEASE_TAG="v$VERSION"
            RELEASE_SHA="$GITHUB_SHA"
            if npm view "pi-design-mode@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              ALREADY_PUBLISHED=true
            else
              ALREADY_PUBLISHED=false
            fi
            if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
              test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
            else
              git tag "$RELEASE_TAG" "$RELEASE_SHA"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          else
            RELEASE_TAG="$MANUAL_TAG"
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            git merge-base --is-ancestor "$RELEASE_SHA" HEAD
            ALREADY_PUBLISHED=false
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "already_published=$ALREADY_PUBLISHED" >> "$GITHUB_OUTPUT"
          git checkout --detach "$RELEASE_SHA"
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - name: 验证 npm OIDC 支持
        run: |
          node --version
          npm --version
          node -e 'const {execSync}=require("node:child_process");const [a,b,c]=execSync("npm --version",{encoding:"utf8"}).trim().split(".").map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))process.exit(1)'
      - run: npm ci --ignore-scripts
      - name: 校验与打包
        run: npm pack
      - name: 仅验证发布包
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && !inputs.verify_only }}
        run: npm publish "pi-design-mode-$(node -p 'require("./package.json").version').tgz" --dry-run --access public
      - name: 使用 OIDC 发布，无长期 Token
        if: ${{ (github.event_name == 'push' && steps.release.outputs.already_published != 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.verify_only) }}
        run: npm publish "pi-design-mode-$(node -p 'require("./package.json").version').tgz" --access public --provenance
      - name: 核验公开版本
        if: ${{ github.event_name == 'push' || inputs.publish || inputs.verify_only }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const {name,version}=JSON.parse(fs.readFileSync('package.json','utf8'));
          const url=`https://registry.npmjs.org/${name}/${version}`;
          let metadata;
          for(let attempt=0;attempt<8;attempt++) {
            let response;
            try { response=await fetch(url,{signal:AbortSignal.timeout(15000)}); }
            catch(error) {
              if(!['TypeError','TimeoutError'].includes(error.name)||attempt===7)throw error;
              await new Promise(resolve=>setTimeout(resolve,10000));
              continue;
            }
            if(response.ok){metadata=await response.json();break;}
            if(response.status!==404&&response.status!==429&&response.status<500)throw new Error(`Registry HTTP ${response.status}`);
            if(attempt===7)throw new Error(`Registry not ready: HTTP ${response.status}`);
            const retry=response.headers.get('retry-after');
            const delay=retry?(/^\d+$/.test(retry)?Number(retry)*1000:Math.max(0,Date.parse(retry)-Date.now())):10000;
            if(!Number.isFinite(delay)||delay>60000)throw new Error('Registry requests a later retry; no republish needed');
            await new Promise(resolve=>setTimeout(resolve,Math.max(10000,delay)));
          }
          if(metadata?.version!==version||!metadata.dist?.integrity)throw new Error('Invalid registry metadata');
          let tar;
          for(let attempt=0;attempt<3;attempt++) {
            tar=await fetch(metadata.dist.tarball,{signal:AbortSignal.timeout(30000)});
            if(tar.ok)break;
            if(tar.status!==404||attempt===2)throw new Error(`Tarball HTTP ${tar.status}`);
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          const actual='sha512-'+createHash('sha512').update(Buffer.from(await tar.arrayBuffer())).digest('base64');
          if(actual!==metadata.dist.integrity)throw new Error('Tarball integrity mismatch');
          console.log(JSON.stringify({name,version,integrity:actual,verified:true}));
          JS
